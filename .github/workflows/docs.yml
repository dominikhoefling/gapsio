name: Docs

# Publishes the documentation (mkdocs) to GitHub Pages.
# GitHub Pages needs a public repository, or GitHub Pro/Team for a private one. Until then the deploy job is skipped;
# set the repository variable PAGES_ENABLED=true (Settings › Secrets and variables › Actions › Variables) to force it.
# Alternative: upload the built "site" folder to your own web space (e.g. docs.<your domain>).

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event.repository.visibility == 'public' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
