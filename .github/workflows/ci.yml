name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Logic and end-to-end tests (no Azure needed)
        shell: pwsh
        run: ./tests/Test-Gapsio.ps1

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $bad++; Write-Host "::error file=$($_.FullName),line=$($errors[0].Extent.StartLineNumber)::$($errors[0].Message)" }
          }
          if ($bad) { exit 1 }

      - name: Bicep compiles and deploy/azuredeploy.json is up to date
        run: |
          az bicep build --file deploy/main.bicep --outfile /tmp/azuredeploy.json
          jq 'del(.metadata._generator)' /tmp/azuredeploy.json > /tmp/built.json
          jq 'del(.metadata._generator)' deploy/azuredeploy.json > /tmp/committed.json
          if ! diff -q /tmp/committed.json /tmp/built.json > /dev/null; then
            echo "::error file=deploy/azuredeploy.json::Outdated. Run: az bicep build -f deploy/main.bicep --outfile deploy/azuredeploy.json"
            diff -u /tmp/committed.json /tmp/built.json | head -50
            exit 1
          fi

      - name: Build release assets
        shell: pwsh
        run: ./build/New-GapsioRelease.ps1

      - name: Public demo is pseudonymised (fails on leaks)
        shell: pwsh
        run: ./build/New-GapsioDemo.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: gapsio-release-assets
          path: dist/release/
          retention-days: 14

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
