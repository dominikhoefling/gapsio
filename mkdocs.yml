site_name: Gapsio
site_url: https://gapsio.cloud/docs/
site_description: Self-hosted visibility into where Microsoft Defender and AI agent protection actually has gaps.
repo_url: https://github.com/dominikhoefling/gapsio
repo_name: gapsio
edit_uri: edit/main/docs/
copyright: Gapsio

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Overview: index.md
  - Get started:
      - Quick start: getting-started.md
      - Installation: installation.md
      - Features and permissions: permissions.md
      - Separation of duties: separation-of-duties.md
      - Updates: updates.md
  - Modules:
      - Endpoint: modules/endpoint.md
      - AI agents: modules/agents.md
      - Access (optional): modules/access.md
      - Licensing (optional): modules/licensing.md
      - Office preview (optional, private preview): modules/office-preview.md
  - Using Gapsio:
      - Portal: portal.md
      - Customising the baseline: baseline.md
      - Operations and settings: operations.md
      - Licence: licensing.md
      - The open-core promise: manifesto.md
      - Support: support.md
  - Reference:
      - Security review: trust.md
      - Compliance mapping: compliance.md
      - Architecture and data protection: security.md
      - Known limitations: limitations.md
      - Testing in a test tenant: testing.md
      - Development and releases: development.md
      - Changelog: changelog.md
