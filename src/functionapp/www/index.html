<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gapsio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="mobile-bar">
      <button id="menu-btn" type="button" class="menu-btn" aria-label="Menu" aria-controls="nav" aria-expanded="false"><span></span><span></span><span></span></button>
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22h26" stroke-width="3.2"/><path d="M7 22V9M16 22V5M25 22V12" stroke-width="2"/></svg>
      <span class="brand-name">Gapsio</span>
    </header>
    <div id="scrim" class="scrim"></div>
    <aside class="side" aria-label="Navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22h26" stroke-width="3.2"/><path d="M7 22V9M16 22V5M25 22V12" stroke-width="2"/></svg>
        <span class="brand-name">Gapsio</span>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="who"></div>
    </aside>
    <div class="content">
      <header class="top">
        <div class="top-meta" id="meta">Loading …</div>
        <div class="top-actions" id="actions"></div>
      </header>
      <div id="notice" class="notice-bar" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
